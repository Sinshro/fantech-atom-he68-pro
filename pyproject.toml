[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantech-atom-he68-pro"
version = "0.1.0"
description = "Conservative HID reverse-engineering toolkit for the Fantech Atom HE68 PRO"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Fantech Atom HE68 PRO reverse-engineering contributors" }]
dependencies = ["hidapi>=0.14", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pre-commit>=4.0", "pytest>=8.0", "ruff>=0.9"]

[project.scripts]
fantech-he68-demo = "fantech_he68.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fantech_he68"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["fantech_he68"]
